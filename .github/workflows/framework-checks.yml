name: Framework checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: read

env:
  RESEARCH_TOOLKIT_TELEMETRY: 'off'

jobs:
  release-metadata:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reuse successful main checks for this exact release commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'framework-checks.yml', branch: 'main',
              event: 'push', head_sha: context.sha, status: 'completed', per_page: 20,
            });
            const passed = data.workflow_runs.find(run => run.head_sha === context.sha && run.conclusion === 'success');
            if (!passed) core.setFailed('This tag must point to a commit with successful main Framework checks. Finish those checks before releasing; do not rerun them on the tag.');
            else core.info(`Reusing ${passed.html_url} for ${context.sha}`);
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check release tag and packaged metadata
        run: |
          python scripts/check_version.py
          python scripts/build_plugin.py --check
          python -c "import os; from pathlib import Path; assert os.environ['GITHUB_REF_NAME'] == 'v' + Path('VERSION').read_text().strip(), 'Release tag must match VERSION'"

  static-site:
    if: github.event_name != 'workflow_run' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify committed static build and initial HTML
        run: python scripts/check_project.py --group site

  deployed-site:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: deployed-site-verification
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify deployed raw HTML, assets, language URLs and sitemap
        run: python scripts/check_site.py --live --attempts 6 --delay 15
      - name: Observe public star total without attribution
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_site.py --stars-output star-observation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-star-observation-${{ github.event.workflow_run.head_sha }}
          path: star-observation.json
          if-no-files-found: ignore

  validate:
    if: github.event_name != 'workflow_run' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned local MCP dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Run repository and workflow checks
        run: python scripts/check_project.py --group runtime

  minimum-python:
    if: github.event_name != 'workflow_run' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Check standard-library CLI on the minimum Python version
        run: |
          python scripts/research_workflow.py --help
          python scripts/check_research_workflow.py
          python scripts/check_draft_contract.py
          python scripts/check_record_workflow.py
          python scripts/check_task_continuity.py
          python scripts/check_plugin_build.py
      - name: Install pinned MCP dependency and check packaged stdio workflow
        run: |
          python -m pip install -r requirements-mcp.txt
          python scripts/check_mcp_contract.py

  windows-runtime:
    if: github.event_name != 'workflow_run' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check Windows task locks and reviewer process cleanup
        run: |
          python scripts/check_plugin_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_task_lock.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_research_workflow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_draft_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_record_workflow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_usage_sharing.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_host_execution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_task_continuity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_profiles_reviewers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_blinded_evals.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_blinded_protocol_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_judge_calibration.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_live_execution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_live_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_development_evidence.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_feedback_probes.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/diagnostics/2026-10-13-targeted-recheck/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/diagnostics/2026-10-13-dedicated-seven/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/repairs/2026-10-13-pipeline-complete/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-13-before-after/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-14-native-agent/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-16-external-batches/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-19-external-batches/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-21-external-batches/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged MCP workflow on Windows
        run: |
          python -m pip install -r requirements-mcp.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_mcp_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
