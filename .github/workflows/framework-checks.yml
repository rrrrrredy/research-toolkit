name: Framework checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  static-site:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed static build and initial HTML
        run: |
          python scripts/build_site.py --check
          python scripts/check_site.py --self-test
          node --check docs/assets/reading-preferences.js
          node --check docs/assets/showcase.js

  deployed-site:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: deployed-site-verification
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deployed raw HTML, assets, language URLs and sitemap
        run: python scripts/check_site.py --live --attempts 6 --delay 15
      - name: Observe public star total without attribution
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_site.py --stars-output star-observation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-star-observation-${{ github.event.workflow_run.head_sha }}
          path: star-observation.json
          if-no-files-found: ignore

  validate:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version consistency
        run: python scripts/check_version.py --self-test
      - name: Check published SKILL sync
        run: |
          python scripts/check_docs_sync.py
          python scripts/check_docs_sync.py --skill SKILL.zh-CN.md --html docs/framework.zh-CN.html
      - name: Check DeepSeek Harness adapter
        run: python scripts/run_dsh_evals.py validate
      - name: Check eval source integrity
        run: python scripts/check_eval_source_integrity.py
      - name: Check source-use and regeneration controls
        run: python scripts/check_source_policy_contract.py
      - name: Check stored-source text and metadata extraction
        run: python scripts/check_source_extraction.py
      - name: Check known-bad regression fixtures
        run: python scripts/check_regression_fixtures.py
      - name: Check known-good conformance fixtures
        run: python scripts/check_conformance_fixtures.py
      - name: Check isolated delivery contract
        run: |
          python scripts/check_delivery_contract.py
          python scripts/check_review_completion_contract.py
      - name: Check evaluator and delivery consistency
        run: python scripts/check_evaluator_contract.py
      - name: Check semantic diagnostic data boundaries
        run: python scripts/check_semantic_diagnostics.py
      - name: Check installation comparison
        run: python scripts/check_installation_contract.py
      - name: Check public diagnostic bundle and failure-preservation controls
        run: python scripts/check_diagnostic_bundle.py --self-test
      - name: Check semantic review evidence and disagreement preservation
        run: python scripts/check_semantic_review_bundle.py --self-test
      - name: Check shared research workflow
        run: |
          python scripts/check_research_workflow.py
          python scripts/check_draft_contract.py
          python scripts/check_record_workflow.py
          python scripts/check_release_updates.py
          python scripts/check_task_lock.py
      - name: Check profiles and reviewer backends
        run: python scripts/check_profiles_reviewers.py
      - name: Check plugin payload matches shared sources
        run: |
          python scripts/build_plugin.py --check
          python scripts/check_plugin_build.py
      - name: Check local MCP protocol with synthetic reviewers
        run: |
          python -m pip install -r requirements-mcp.txt
          python scripts/check_mcp_contract.py
      - name: Check blinded pilot and historical reproduction without model calls
        run: |
          python scripts/check_blinded_evals.py
          python scripts/check_blinded_protocol_v2.py
          python scripts/check_judge_calibration.py --self-test
          python scripts/check_live_execution.py
          python scripts/check_live_diagnostics.py
          python scripts/check_development_evidence.py --self-test
          python scripts/check_feedback_probes.py --self-test
          python evals/diagnostics/2026-10-13-targeted-recheck/verify.py
          python evals/diagnostics/2026-10-13-dedicated-seven/verify.py
          python evals/repairs/2026-10-13-pipeline-complete/verify.py
          python evals/studies/2026-10-13-before-after/verify.py
          python evals/studies/2026-10-14-native-agent/verify.py
          python evals/studies/2026-10-16-external-batches/verify.py
          python evals/studies/2026-10-19-external-batches/verify.py
      - name: Check study verification under Python optimization without rewriting evidence
        run: python scripts/check_study_verification.py

  minimum-python:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check standard-library CLI on the minimum Python version
        run: |
          python scripts/research_workflow.py --help
          python scripts/check_research_workflow.py
          python scripts/check_draft_contract.py
          python scripts/check_record_workflow.py
          python scripts/check_plugin_build.py
      - name: Install pinned MCP dependency and check packaged stdio workflow
        run: |
          python -m pip install -r requirements-mcp.txt
          python scripts/check_mcp_contract.py

  windows-runtime:
    if: github.event_name != 'workflow_run'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Windows task locks and reviewer process cleanup
        run: |
          python scripts/check_plugin_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_task_lock.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_research_workflow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_draft_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_record_workflow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_profiles_reviewers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_blinded_evals.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_blinded_protocol_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_judge_calibration.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_live_execution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_live_diagnostics.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_development_evidence.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_feedback_probes.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/diagnostics/2026-10-13-targeted-recheck/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/diagnostics/2026-10-13-dedicated-seven/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/repairs/2026-10-13-pipeline-complete/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-13-before-after/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-14-native-agent/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-16-external-batches/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python evals/studies/2026-10-19-external-batches/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged MCP workflow on Windows
        run: |
          python -m pip install -r requirements-mcp.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_mcp_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
