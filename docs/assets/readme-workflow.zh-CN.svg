<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 126" role="img" aria-labelledby="title desc">
  <title id="title">长报告如何完成</title>
  <desc id="desc">从问题出发，核查来源、形成主稿，独立评审发现问题后改稿，复查通过后交付。</desc>
  <rect width="900" height="126" rx="12" fill="#f6f8f6"/>
  <g stroke="#526d5d" fill="none" stroke-width="1.7"><path d="M75 38H813"/><path d="M624 92v14H450v-9m-4 5 4-5 4 5"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="86" cy="38" r="6" fill="#345b45"/><text x="86" y="67" font-size="16" font-weight="650" fill="#1d3024">研究问题</text><text x="86" y="87" font-size="12" fill="#405448">用途、要求、范围</text>
    <circle cx="268" cy="38" r="6" fill="#345b45"/><text x="268" y="67" font-size="16" font-weight="650" fill="#1d3024">来源与判断</text><text x="268" y="87" font-size="12" fill="#405448">查原件，记下依据</text>
    <circle cx="450" cy="38" r="6" fill="#345b45"/><text x="450" y="67" font-size="16" font-weight="650" fill="#1d3024">完整稿件</text><text x="450" y="87" font-size="12" fill="#405448">合并分析，保留引用</text>
    <circle cx="632" cy="38" r="6" fill="#345b45"/><text x="632" y="67" font-size="16" font-weight="650" fill="#1d3024">独立检查</text><text x="632" y="87" font-size="12" fill="#405448">评审、审计、复查</text>
    <circle cx="814" cy="38" r="6" fill="#345b45"/><text x="814" y="67" font-size="16" font-weight="650" fill="#1d3024">交付</text><text x="814" y="87" font-size="12" fill="#405448">成稿及对应回执</text>
  </g>
</svg>
