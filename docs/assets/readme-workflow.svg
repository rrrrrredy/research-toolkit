<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 324" role="img" aria-labelledby="title desc">
  <title id="title">Four responsibilities in a long study</title>
  <desc id="desc">Define the task. When opening a study or changing scope; Support a claim. When a conclusion affects a decision; Assemble the draft. When findings need to work together; Review and deliver. When a full draft is ready or revised</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M1 0l4 3-4 3" fill="none" stroke="#53715e"/></marker></defs>
  <rect width="820" height="324" rx="10" fill="#f6f8f6"/>
  <g font-family="system-ui, sans-serif">
    <g>
      <text x="24" y="41" fill="#1d3024" font-size="18" font-weight="650">Define the task</text>
      <text x="24" y="63" fill="#405448" font-size="13">When opening a study or changing scope</text>
      <path d="M340 40h126m26 0h143" fill="none" stroke="#53715e" stroke-width="1.5" marker-end="url(#arrow)"/>
      <circle cx="331" cy="40" r="4" fill="#345b45"/><text x="331" y="66" text-anchor="middle" fill="#1d3024" font-size="14">Question</text>
      <circle cx="496" cy="40" r="4" fill="#345b45"/><text x="496" y="66" text-anchor="middle" fill="#1d3024" font-size="14">Reader and use</text>
      <circle cx="661" cy="40" r="4" fill="#345b45"/><text x="661" y="66" text-anchor="middle" fill="#1d3024" font-size="14">Brief</text>
    </g>
    <g>
      <text x="24" y="119" fill="#1d3024" font-size="18" font-weight="650">Support a claim</text>
      <text x="24" y="141" fill="#405448" font-size="13">When a conclusion affects a decision</text>
      <path d="M340 118h126m26 0h143" fill="none" stroke="#53715e" stroke-width="1.5" marker-end="url(#arrow)"/>
      <circle cx="331" cy="118" r="4" fill="#345b45"/><text x="331" y="144" text-anchor="middle" fill="#1d3024" font-size="14">Source</text>
      <circle cx="496" cy="118" r="4" fill="#345b45"/><text x="496" y="144" text-anchor="middle" fill="#1d3024" font-size="14">Check and challenge</text>
      <circle cx="661" cy="118" r="4" fill="#345b45"/><text x="661" y="144" text-anchor="middle" fill="#1d3024" font-size="14">Claim and limits</text>
    </g>
    <g>
      <text x="24" y="197" fill="#1d3024" font-size="18" font-weight="650">Assemble the draft</text>
      <text x="24" y="219" fill="#405448" font-size="13">When findings need to work together</text>
      <path d="M340 196h126m26 0h143" fill="none" stroke="#53715e" stroke-width="1.5" marker-end="url(#arrow)"/>
      <circle cx="331" cy="196" r="4" fill="#345b45"/><text x="331" y="222" text-anchor="middle" fill="#1d3024" font-size="14">Research units</text>
      <circle cx="496" cy="196" r="4" fill="#345b45"/><text x="496" y="222" text-anchor="middle" fill="#1d3024" font-size="14">Cross-check</text>
      <circle cx="661" cy="196" r="4" fill="#345b45"/><text x="661" y="222" text-anchor="middle" fill="#1d3024" font-size="14">Main draft</text>
    </g>
    <g>
      <text x="24" y="275" fill="#1d3024" font-size="18" font-weight="650">Review and deliver</text>
      <text x="24" y="297" fill="#405448" font-size="13">When a full draft is ready or revised</text>
      <path d="M340 274h126m26 0h143" fill="none" stroke="#53715e" stroke-width="1.5" marker-end="url(#arrow)"/>
      <circle cx="331" cy="274" r="4" fill="#345b45"/><text x="331" y="300" text-anchor="middle" fill="#1d3024" font-size="14">Review</text>
      <circle cx="496" cy="274" r="4" fill="#345b45"/><text x="496" y="300" text-anchor="middle" fill="#1d3024" font-size="14">Audit and revise</text>
      <circle cx="661" cy="274" r="4" fill="#345b45"/><text x="661" y="300" text-anchor="middle" fill="#1d3024" font-size="14">Final check and delivery</text>
    </g>
  </g>
</svg>
